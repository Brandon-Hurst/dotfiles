add_newline = true

format = """
$directory\
$git_branch\
$git_status\
$cmd_duration\
$line_break\
$character
"""

[directory]
style = "bold #d4a44b"

[git_branch]
symbol = " "
style = "bold cyan"

[git_status]
style = "yellow"

[cmd_duration]
min_time = 1000
style = "bold yellow"

[character]
success_symbol = "[❯](bold green)"
error_symbol = "[❯](bold red)"
